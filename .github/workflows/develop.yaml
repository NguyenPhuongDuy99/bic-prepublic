name: develop
run-name: ${{ github.ref_name }}
on:
  pull_request:
    types:
      - closed
    branches: ["develop"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read # This is required for actions/checkout
  id-token: write # This is required for requesting the JWT

jobs:
  develop:
    if: ${{ github.ref_name == 'develop' }}
    runs-on: ubuntu-24.04
    environment: dev
    env:
      AWS_SM_SECRET_ID: /bic/ci
      AWS_IAM_ROLE: arn:aws:iam::210668178631:role/bic-all-github-action-iam-role
      GIT_BRANCH: develop
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      NEXT_PUBLIC_VERCEL_GIT_COMMIT_SHA: ${{ github.sha }}
      VERCEL_GIT_COMMIT_SHA: ${{ github.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials with IAM Role
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ env.AWS_IAM_ROLE }}
          aws-region: ap-southeast-1

      - name: Get Secrets from AWS Secrets Manager
        uses: aws-actions/aws-secretsmanager-get-secrets@v1
        with:
          secret-ids: |
            ${{ env.AWS_SM_SECRET_ID }}
          parse-json-secrets: true

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20.11

      - name: Cache node modules
        id: cache-npm
        uses: actions/cache@v4
        env:
          cache-name: develop-cache-node-modules
        with:
          # npm cache files are stored in `./node_modules` on Linux
          path: ./node_modules
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}

      - name: Install Vercel
        run: |
          npm i -g vercel
          npm i -g vercel@latest
          vercel --version

      - name: Vercel CLI build and deploy
        run: |
          # pull vercel settings and env variables
          vercel pull --environment preview --git-branch ${{ env.GIT_BRANCH }} --scope bic --token ${{ env._BIC_CI_VERCEL_TOKEN }} --yes
          # build
          vercel build --token ${{ env._BIC_CI_VERCEL_TOKEN }}
          # deploy
          vercel deploy --prebuilt --token ${{ env._BIC_CI_VERCEL_TOKEN }}
      # - name: Trigger Vercel Deployment
      #   run: curl --location --request GET "${{ env._BIC_CI_DEV_GROUP_WEB_DEPLOY_HOOK }}"
